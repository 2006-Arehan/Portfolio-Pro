# ===================================================================
# PortfolioPro: Stock Trading & Portfolio Management System
# College & HCL Project Submission Configuration
# ===================================================================

server.port=8080
spring.application.name=PortfolioPro

# --- H2 Database Configuration (File-based Persistence) ---
spring.datasource.url=jdbc:h2:file:./data/portfoliopro;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- H2 Web Console (Accessible at http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- Jackson JSON Serialization ---
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.portfoliopro=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
