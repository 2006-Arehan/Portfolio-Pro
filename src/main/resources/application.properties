# ===================================================================
# PortfolioPro: Stock Trading & Portfolio Management System
# College & HCL Project Submission Configuration
# ===================================================================

# Use PORT env var if set (Railway/Render), else default 8080
server.port=${PORT:8080}
spring.application.name=PortfolioPro

# --- H2 Database Configuration ---
# In-memory mode for cloud deployments; file mode for local use
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:portfoliopro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- H2 Web Console (Accessible at http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- Jackson JSON Serialization ---
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.portfoliopro=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
