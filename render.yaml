services:
  - type: web
    name: portfoliopro
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/portfoliopro-1.0.0-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
    healthCheckPath: /api/stocks
    autoDeploy: true
